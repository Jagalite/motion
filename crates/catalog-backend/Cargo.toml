[package]
name = "motion-catalog-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
playscale-core = { path = "../core" }
catabolic-core.workspace = true
catabolic-store.workspace = true
catabolic-runtime.workspace = true
anyhow = "1"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = "=0.40.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
