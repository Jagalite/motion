components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque revocable device or integration credential.
    cookieAuth:
      type: apiKey
      in: cookie
      name: motion_session
      description: HttpOnly session cookie; CSRF and Origin rules apply to every unsafe method.
    mediaTicket:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived revocable capability restricted to a file revision, download, or delivery
        generation. Not valid on JSON APIs.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 256
      description: 'Strong ETag from the current target-resource GET. Missing: 428; stale: 412. No wildcard
        updates.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 16
      description: 'Scoped to principal, operation and target. Exact retry returns saved acknowledgement.
        Different content with same key: 409. Minimum retention 7 days, and for active durable requests
        through termination plus 7 days.'
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
      description: REQUIRED for cookie-authenticated unsafe requests, including read-only POSTs. Not required
        with an explicit Authorization bearer header. Origin/Host policy remains enforced.
  responses:
    E400:
      description: Invalid request or unsupported conditional combination
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Authenticated request denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Unknown or inaccessible resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Domain state conflict, source changed, duplicate mismatch or cursor resync required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E410:
      description: Authorized request for retired or expired generation/resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E412:
      description: If-Match precondition failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: Request body too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E415:
      description: Unsupported media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Well-formed request violates semantic constraints
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E428:
      description: Required precondition missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: Caller quota or rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
    E500:
      description: Internal error, redacted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E503:
      description: Temporary capacity, database or dependency unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    Revision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      maxLength: 20
      description: Unsigned decimal string; compare as integers, not lexically.
    UInt64:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      maxLength: 20
      description: Unsigned decimal string; compare as integers, not lexically.
    Milliseconds:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Milliseconds on the logical timeline; finite safe JSON integer.
    Cursor:
      type: string
      maxLength: 2048
      minLength: 1
    Timestamp:
      type: string
      format: date-time
    Digest:
      type: string
      pattern: ^sha256:[a-f0-9]{64}$
    JsonValue: {}
    MediaKind:
      type: string
      enum:
      - movie
      - series
      - season
      - episode
      - video
      - music_video
      - artist
      - album
      - recording
      - track
      - photo
      - photo_album
      - person
      - collection
      - other
    Availability:
      type: string
      enum:
      - available
      - unavailable
      - unknown
      - degraded
    Permissions:
      type: array
      items:
        type: string
        enum:
        - catalog:read
        - catalog:write
        - sources:manage
        - profiles:manage
        - viewing:write
        - playback:request
        - processing:request
        - downloads:manage
        - collections:write
        - events:read
        - system:admin
      maxItems: 32
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 100
        detail:
          type: string
          maxLength: 2000
        request_id:
          $ref: '#/components/schemas/Id'
        retryable:
          type: boolean
      required:
      - type
      - title
      - status
      - code
      - request_id
      - retryable
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - starting
          - draining
          - degraded
        server_id:
          $ref: '#/components/schemas/Id'
        server_epoch:
          $ref: '#/components/schemas/Id'
      required:
      - status
      - server_id
      - server_epoch
    Feature:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 100
        implemented:
          type: boolean
        enabled:
          type: boolean
        qualification:
          type: string
          enum:
          - unqualified
          - partial
          - qualified
        limits:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UInt64'
        receipt_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 200
      required:
      - id
      - implemented
      - enabled
      - qualification
      - limits
      - receipt_ids
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        server_id:
          $ref: '#/components/schemas/Id'
        server_epoch:
          $ref: '#/components/schemas/Id'
        server_version:
          type: string
          maxLength: 256
        api_version:
          type: string
          maxLength: 256
        schema_version:
          $ref: '#/components/schemas/Revision'
        contract_digest:
          $ref: '#/components/schemas/Digest'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
          maxItems: 200
        runtime_hashes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Digest'
      required:
      - server_id
      - server_epoch
      - server_version
      - api_version
      - schema_version
      - contract_digest
      - features
      - runtime_hashes
    Principal:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        device_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        profile_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 200
        permissions:
          $ref: '#/components/schemas/Permissions'
        policy_revision:
          $ref: '#/components/schemas/Revision'
        mode:
          type: string
          enum:
          - paired
          - trusted_private
          - integration
      required:
      - id
      - device_id
      - profile_ids
      - permissions
      - policy_revision
      - mode
    AccessTokenInput:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
      required:
      - ttl_seconds
      description: Issue short-lived API access from the authenticated device or integration credential.
        Scope is inherited and never expanded; revocation is checked against the parent credential.
    PairingRequest:
      type: object
      additionalProperties: false
      properties:
        device_name:
          type: string
          maxLength: 100
          minLength: 1
        client_name:
          type: string
          maxLength: 100
          minLength: 1
      required:
      - device_name
      - client_name
    Pairing:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        device_code:
          type: string
          maxLength: 256
          minLength: 32
        user_code:
          type: string
          maxLength: 32
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        poll_interval_seconds:
          type: integer
          minimum: 1
          maximum: 60
      required:
      - id
      - device_code
      - user_code
      - expires_at
      - poll_interval_seconds
      description: Device code is a secret. Rate-limit creation and claim polling; never include it in
        logs or events.
    PairingApproval:
      type: object
      additionalProperties: false
      properties:
        user_code:
          type: string
          maxLength: 32
        profile_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 200
        permissions:
          $ref: '#/components/schemas/Permissions'
      required:
      - user_code
      - profile_ids
      - permissions
    PairingClaim:
      type: object
      additionalProperties: false
      properties:
        device_code:
          type: string
          maxLength: 256
          minLength: 32
      required:
      - device_code
    Credential:
      type: object
      additionalProperties: false
      properties:
        device_id:
          $ref: '#/components/schemas/Id'
        access_token:
          type: string
          maxLength: 4096
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - device_id
      - access_token
      - expires_at
      description: 'Opaque revocable credential; return with Cache-Control: no-store.'
    SessionExchange:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: credential
          credential:
            type: string
            maxLength: 4096
            minLength: 32
        required:
