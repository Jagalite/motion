openapi: 3.1.0
info:
  title: Motion Public Server API
  version: 2.0.0
  description: Finalized implementation target for the Motion-owned Rust architecture, dated 2026-10-09.
    Not a claim of running endpoints. Motion owns catalog, SQLite, jobs and media serving; Catabolic is
    a pinned design/test reference only. Per-operation x-milestone gates release availability. See Motion_Final_Architecture_and_Implementation_Plan.md
    for protocol semantics and authorization.
  license:
    name: MIT
servers:
- url: /
security:
- bearerAuth: []
- cookieAuth: []
x-contract-status: finalized-design-not-implemented
x-design-version: 1.1.0
tags:
