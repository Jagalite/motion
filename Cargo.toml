[workspace]
members = [".", "crates/core", "crates/motion-ui", "crates/motion-ui-host", "crates/catalog-backend"]
default-members = [".", "crates/core", "crates/motion-ui", "crates/motion-ui-host", "crates/catalog-backend"]
exclude = ["research/framework-review"]
resolver = "2"

[workspace.dependencies]
catabolic-core = { git = "https://github.com/Jagalite/catabolic.git", rev = "6969f08c5d9b207afe8eec819555759be136644d" }
catabolic-store = { git = "https://github.com/Jagalite/catabolic.git", rev = "6969f08c5d9b207afe8eec819555759be136644d" }
catabolic-runtime = { git = "https://github.com/Jagalite/catabolic.git", rev = "6969f08c5d9b207afe8eec819555759be136644d" }
stateless = { package = "statelessness", version = "=0.2.0" }

[package]
name = "playscale"
default-run = "playscale"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
catabolic-core.workspace = true
catabolic-store.workspace = true
catabolic-runtime.workspace = true
motion-catalog-backend = { path = "crates/catalog-backend" }
playscale-core = { path = "crates/core" }
motion-ui = { path = "crates/motion-ui" }
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
axum = "=0.8.9"
notify = "8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace"] }
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = { version = "0.10", features = ["asm"] }
hmac = "0.12"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
chacha20poly1305 = "=0.10.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# Native direct mail delivery: MX discovery, STARTTLS and DKIM. ring performs the
# RSA signing; rsa is used only to generate and decode PKCS#1/PKCS#8 keys.
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
walkdir = "2"
cap-std = "3"
mime_guess = "2"
httpdate = "1"
time = { version = "0.3", features = ["parsing"] }
url = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-core = "0.3"
http-body = "1"
fs2 = "0.4"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite-0.8.6" }
fancy-regex = { git = "https://github.com/Jagalite/catabolic.git", rev = "6969f08c5d9b207afe8eec819555759be136644d" }

# Explicit integration/CI profile. Keep development defaults unchanged while
# producing the real embedded observer executable within its 128 MiB bound.
# Debug assertions and overflow checks remain enabled; this is not release mode.
[profile.native-qualification]
inherits = "dev"
debug = 0
strip = "symbols"
incremental = false
debug-assertions = true
overflow-checks = true

# Optimize core/model targets and their serialization hot path. Preserve every
# assertion, arithmetic check and exploration bound; ordinary dev is unchanged.
[profile.native-qualification.package.playscale-core]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.native-qualification.package.serde_json]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.native-qualification.package.serde]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.native-qualification.package.serde_core]
opt-level = 2
debug-assertions = true
overflow-checks = true
