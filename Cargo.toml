[workspace]
members = [".", "crates/core", "crates/motion-ui"]
default-members = [".", "crates/core", "crates/motion-ui"]
exclude = ["research/framework-review"]
resolver = "2"

[workspace.dependencies]
stateless = { package = "statelessness", version = "=0.1.1" }

[package]
name = "playscale"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
playscale-core = { path = "crates/core" }
motion-ui = { path = "crates/motion-ui" }
anyhow = "1"
axum = "=0.8.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace"] }
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
walkdir = "2"
cap-std = "3"
mime_guess = "2"
httpdate = "1"
url = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-core = "0.3"
fs2 = "0.4"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
