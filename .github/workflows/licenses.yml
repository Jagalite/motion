name: Dependency notices

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  notices:
    # Linux: the checks read tracked source and cargo metadata only; the notice
    # target below stays the shipped macOS arm64 build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check the source proposed by the pull request.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Test publication privacy check
        run: python3 scripts/test_check_publication.py
      - name: Check source publication privacy
        # Commit email addresses are permitted; source privacy checks remain required.
        run: python3 scripts/check_publication.py --source-only
      - name: Test notice collection
        run: python3 scripts/test_third_party_notices.py
      - name: Check locked dependency notices
        run: python3 scripts/third_party_notices.py --target aarch64-apple-darwin --check
