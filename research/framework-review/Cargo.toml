[package]
name = "playscale-framework-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "=0.8.9"
tower-http = { version = "=0.7.1", features = ["fs"] }
poem = { version = "=3.1.12", features = ["static-files"] }
salvo = { version = "=1.0.1", default-features = false, features = ["server", "http1", "http2", "oapi"] }
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
poem-openapi = "=5.1.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
